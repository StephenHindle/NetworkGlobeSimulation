<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Packet Journey: Adelaide to Sydney</title>
<style>
  :root{
    --bg:#02050b; --panel:rgba(6,16,30,.78); --line:rgba(80,190,255,.22);
    --ink:#d8ecff; --mute:#7f9bb8; --accent:#39d0ff;
    --tcp:#ffb347; --tls:#c792ff; --req:#4fd8ff; --res:#5cff9d; --fin:#ff6b8b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  #app{position:fixed;inset:0;user-select:none;-webkit-user-select:none;touch-action:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #ov{pointer-events:none}
  .panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #hud{top:12px;left:12px;right:62px;height:38px;padding:0 5px 0 14px;display:flex;align-items:center;gap:14px;white-space:nowrap;overflow:hidden}
  #hud h1{margin:0;font-size:14px;font-weight:650;letter-spacing:.02em;flex:0 0 auto}
  #hud .sub{font-size:11.5px;color:var(--mute);flex:0 100 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  #phases{display:flex;flex-wrap:nowrap;gap:5px;flex:0 1 auto;min-width:0;overflow:hidden}
  #begin{margin-left:auto;flex:0 0 auto;border:1px solid var(--accent);background:var(--accent);color:#04121f;border-radius:7px;
    font:700 12.5px "Segoe UI",system-ui,sans-serif;padding:6px 14px;cursor:pointer;box-shadow:0 0 14px -3px var(--accent)}
  #begin:hover{filter:brightness(1.12)}
  #begin:disabled{opacity:.4;cursor:default;box-shadow:none}
  .ph{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.12);
    color:var(--mute);transition:all .35s;white-space:nowrap}
  .ph i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:var(--c);opacity:.5;vertical-align:0}
  .ph.on{color:#fff;border-color:var(--c);box-shadow:0 0 12px -2px var(--c);background:rgba(255,255,255,.05)}
  .ph.on i{opacity:1}
  #log{left:12px;bottom:12px;padding:8px 10px;width:250px;font-size:11.5px;transition:opacity .4s}
  #log .t{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
  .ev{display:flex;align-items:center;gap:7px;height:19px;transition:opacity .4s}
  .ev .ar{width:12px;text-align:center;color:var(--mute)}
  .ev .tg{font-weight:650;padding:1px 6px;border-radius:5px;color:#071019;background:var(--c);font-size:11px;white-space:nowrap}
  .ev .wh{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #zoom{right:12px;top:50%;transform:translateY(-50%);width:58px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:8px}
  #zoom button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:rgba(57,208,255,.08);
    color:var(--ink);font-size:18px;line-height:1;cursor:pointer;padding:0}
  #zoom button:hover{background:rgba(57,208,255,.2)}
  #track{position:relative;width:32px;height:min(46vh,300px);cursor:pointer;touch-action:none}
  #track .rail{position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;border-radius:2px;background:rgba(255,255,255,.1)}
  #track .fill{position:absolute;left:50%;bottom:0;width:4px;margin-left:-2px;border-radius:2px;
    background:linear-gradient(to top,#1b6fa8,var(--accent))}
  #track .tick{position:absolute;left:50%;width:10px;height:1px;margin-left:-5px;background:rgba(255,255,255,.35)}
  #thumb{position:absolute;left:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;
    background:#06121f;border:2px solid var(--accent);box-shadow:0 0 14px var(--accent)}
  #zlab{font-size:10px;color:var(--mute);text-align:center;line-height:1.2}
  #stage{left:50%;bottom:14px;transform:translateX(-50%);padding:6px 14px;font-size:12.5px;letter-spacing:.04em;
    white-space:nowrap;pointer-events:none;transition:opacity .3s}
  #stage b{color:var(--accent);font-weight:600}
  #hint{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);font-size:13px;color:var(--ink);
    padding:8px 14px;border-radius:999px;background:rgba(57,208,255,.12);border:1px solid rgba(57,208,255,.35);
    transition:opacity .6s;pointer-events:none;white-space:nowrap}
  .off{display:none!important}
  #err[hidden]{display:none}
  #legend{left:12px;top:62px;padding:7px 10px;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--mute);transition:opacity .4s;pointer-events:none}
  #legend b{color:var(--ink);font-weight:600;letter-spacing:.04em}
  #legend span{display:flex;align-items:center;gap:5px;white-space:nowrap}
  #legend i{width:16px;height:3px;border-radius:2px;background:var(--c);box-shadow:0 0 6px var(--c)}
  #pkt{position:absolute;z-index:8;pointer-events:none;min-width:250px;max-width:340px;border-radius:12px;overflow:hidden;
    background:rgba(5,14,26,.94);border:1.5px solid var(--c);box-shadow:0 0 22px -4px var(--c),0 8px 24px rgba(0,0,0,.5);
    font:12px "Segoe UI",system-ui,sans-serif;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
  #pkt.show{opacity:1;transform:none}
  #pkt .hd{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--c);color:#071019;font-weight:700;font-size:13px}
  #pkt .hd .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #pkt .lt{font:700 10px "Segoe UI",system-ui,sans-serif;padding:2px 6px;border-radius:999px;white-space:nowrap}
  #pkt .hd .lt{background:rgba(7,16,25,.85);color:var(--c)}
  #pkt .rows{padding:6px 8px 8px;display:flex;flex-direction:column;gap:5px}
  #pkt .row{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start;padding:5px 8px;border-radius:8px;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}
  #pkt .row .lt{background:rgba(57,208,255,.14);color:#9fe6ff;text-align:center;margin-top:1px}
  #pkt .row b{display:block;color:#e6f4ff;font-weight:600;font-size:11.5px}
  #pkt .row span{color:#9fbad3;font-family:ui-monospace,Consolas,Menlo,monospace;font-size:11.5px;word-break:break-all}
  #pkt .row em{display:block;margin-top:2px;font-style:normal;color:#ffc45a;font-family:"Segoe UI",system-ui,sans-serif;font-size:10.5px}
  #pkt .hop{padding:0 10px 8px;color:var(--mute);font-size:10.5px}
  #fs{position:absolute;top:12px;right:12px;z-index:6;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #fs:hover{background:rgba(57,208,255,.22);border-color:var(--accent)}
  #fs svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #urlbar{z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px;width:min(390px,calc(100% - 110px));
    opacity:0;pointer-events:none;transition:opacity .3s}
  #urlbar.show{opacity:1;pointer-events:auto}
  #urlhd{flex-basis:100%;font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;padding:0 3px}
  #url{flex:1;min-width:0;background:#020a14;border:1px solid var(--line);border-radius:7px;color:var(--ink);
    font:13px "Segoe UI",system-ui,sans-serif;padding:7px 9px;outline:none;user-select:text;-webkit-user-select:text}
  #url:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(57,208,255,.2)}
  #urlerr{flex-basis:100%;font-size:11px;color:var(--fin);padding:0 3px}
  .btn{border:1px solid var(--line);background:rgba(57,208,255,.12);color:var(--ink);border-radius:7px;
    font:600 12px "Segoe UI",system-ui,sans-serif;padding:7px 11px;cursor:pointer;white-space:nowrap}
  .btn:hover{background:rgba(57,208,255,.25)}
  .btn.go{background:var(--accent);color:#04121f;border-color:var(--accent)}
  #runbar{left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:6px 7px 6px 12px;max-width:calc(100% - 24px)}
  #rb-text{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  #rb-text b{color:var(--accent);font-weight:600}
  .rb-btns{display:flex;gap:5px;flex-shrink:0}
  .rb-btns .btn{padding:5px 9px}
  #zoom.locked{opacity:.55;pointer-events:none}
  #err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;color:var(--mute)}
  @media (max-width:1000px){
    #runbar{left:274px;right:84px;transform:none}
    #hud .sub{display:none}
  }
  @media (max-width:720px){
    #stage{left:auto;right:84px;transform:none;font-size:11px}
    #log{width:200px}
    #hint{bottom:auto;top:46%}
  }
  @media (max-width:520px){ #log{display:none} #phases{display:none} #runbar{left:12px;flex-wrap:wrap} }
</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <canvas id="ov"></canvas>
  <div id="hud" class="panel">
    <h1>Packet Journey: from power on to page load</h1>
    <div class="sub">Norwood SA home network → the internet</div>
    <div id="phases"></div>
    <button id="begin" type="button">Begin Journey</button>
  </div>
  <div id="stage" class="panel">Global view</div>
  <div id="legend" class="panel"><b>Global traffic</b><span style="--c:#4fd8ff"><i></i>Web</span><span style="--c:#ff5fd2"><i></i>Video</span><span style="--c:#ffc45a"><i></i>Email</span><span style="--c:#a98bff"><i></i>DNS</span></div>
  <div id="log" class="panel"><div class="t">Packet log</div><div id="evs"></div></div>
  <div id="zoom" class="panel">
    <button id="zin" title="Zoom in" aria-label="Zoom in">+</button>
    <div id="track" role="slider" aria-label="Zoom" aria-valuemin="0" aria-valuemax="100" tabindex="0">
      <div class="rail"></div><div class="fill" id="fill"></div><div id="thumb"></div>
    </div>
    <button id="zout" title="Zoom out" aria-label="Zoom out">−</button>
    <div id="zlab">ZOOM</div>
  </div>
  <div id="hint">Scroll, or drag the zoom bar, to fly in</div>
  <form id="urlbar" class="panel" autocomplete="off">
    <div id="urlhd">Your laptop's browser</div>
    <input id="url" type="text" spellcheck="false" inputmode="url" placeholder="Type a web address, like www.adelaide.edu.au" aria-label="Web address">
    <button class="btn go" type="submit">Go</button>
    <div id="urlerr" class="off"></div>
  </form>
  <div id="runbar" class="panel off">
    <div id="rb-text"></div>
    <div class="rb-btns" id="rb-btns">
      <button class="btn" id="rb-pause">Pause</button><button class="btn" id="rb-step">Step</button><button class="btn" id="rb-speed">1×</button><button class="btn" id="rb-stop">Stop</button>
    </div>
  </div>
  <button id="fs" type="button" title="Full screen" aria-label="Full screen">
    <svg id="fs-in" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    <svg id="fs-out" viewBox="0 0 24 24" style="display:none"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
  </button>
  <div id="pkt"></div>
  <div id="err" hidden></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

const DOT_VS=`
uniform float uSize; uniform float uScale; uniform float uMax; uniform float uSelf; uniform float uNext; uniform float uOpacity;
attribute float aShade; attribute float aOwn; attribute float aIn; varying float vA; varying float vS;
void main(){
  vec4 mv=modelViewMatrix*vec4(position,1.0);
  float px=uSize*uScale/max(-mv.z,1e-7);
  vec3 n=normalize(normalMatrix*position);
  float f=dot(n,normalize(-mv.xyz));
  vA=clamp(px*px,0.0,1.0)*smoothstep(-0.02,0.3,f)*mix(1.0,aOwn,1.0)*uSelf*(1.0-aIn*uNext);
  vS=aShade;
  if(vA*uOpacity<0.004){ gl_PointSize=0.0; gl_Position=vec4(2.0,2.0,2.0,1.0); return; }   // skip: nothing to draw
  gl_PointSize=clamp(px,1.0,uMax);
  gl_Position=projectionMatrix*mv;
}`;
const DOT_FS=`
uniform vec3 uColor; uniform float uOpacity; uniform float uTime;
varying float vA; varying float vS;
void main(){
  vec2 c=gl_PointCoord-0.5; float d=length(c); if(d>0.5) discard;
  float a=smoothstep(0.5,0.08,d);
  float tw=0.78+0.22*sin(uTime*1.3+vS*60.0);
  gl_FragColor=vec4(uColor*(0.55+0.65*vS)*tw, a*vA*uOpacity);
}`;
const dotLayers=[];
function makeDots(pos,size,color,max,parent,own,inn){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  const n=pos.length/3, sh=new Float32Array(n); for(let i=0;i<n;i++) sh[i]=rand();
  g.setAttribute('aShade',new THREE.BufferAttribute(sh,1));
  g.setAttribute('aOwn',new THREE.BufferAttribute(own?new Float32Array(own):new Float32Array(n).fill(1),1));
  g.setAttribute('aIn',new THREE.BufferAttribute(inn?new Float32Array(inn):new Float32Array(n),1));
  const u={uSize:{value:size},uScale:{value:600},uMax:{value:max||9},uOpacity:{value:1},uColor:{value:new THREE.Color(color)},uTime:{value:0},uSelf:{value:1},uNext:{value:0}};
  const m=new THREE.ShaderMaterial({uniforms:u,vertexShader:DOT_VS,fragmentShader:DOT_FS,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  const p=new THREE.Points(g,m); p.frustumCulled=false; (parent||globe).add(p);
  const L={p,u,max:max||9}; dotLayers.push(L); return L;
}

/* ---------- decorative arcs (global view) ---------- */
const ARC_TYPES={
  web:  {col:'#4fd8ff',name:'Web',  len:7, w:2.2,spd:[0.22,0.38],lift:1},
  video:{col:'#ff5fd2',name:'Video',len:18,w:2.8,spd:[0.13,0.2], lift:1.15},
  email:{col:'#ffc45a',name:'Email',len:5, w:2.0,spd:[0.1,0.16], lift:0.9},
  dns:  {col:'#a98bff',name:'DNS',  len:3, w:1.8,spd:[0.5,0.75], lift:0.6}
};
const ARCS=[];
(function(){
  const bag=['web','web','web','web','video','video','video','email','email','dns','dns'];
  let tries=0;
  while(ARCS.length<64&&tries<2000){ tries++;
    const a=CITIES[Math.floor(rand()*CITIES.length)], b=CITIES[Math.floor(rand()*CITIES.length)]; if(a===b) continue;
    const A=ll(a[0],a[1]).normalize(), B=ll(b[0],b[1]).normalize(), ang=A.angleTo(B); if(ang<0.25||ang>2.6) continue;
    const type=bag[ARCS.length%bag.length], T=ARC_TYPES[type];
    const pts=[]; for(let k=0;k<=56;k++){const t=k/56; const v=A.clone().multiplyScalar(Math.sin((1-t)*ang)/Math.sin(ang)).add(B.clone().multiplyScalar(Math.sin(t*ang)/Math.sin(ang))); v.normalize().multiplyScalar(1.002+Math.sin(Math.PI*t)*(0.025+ang*0.065)*T.lift); pts.push(v);}

  }
})();

function drawOverlay(time,netA,decoA,packets,O){
  O=O||{};
  if(!O.inset) pktHits.length=0;
  if(!O.inset){ ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,VW,VH); }
  labelRects.length=0;
  const mw=globe.matrixWorld;

  // decorative arcs
  if(decoA>0.01){
    ctx.lineCap='round';
    for(const A of ARCS){
      const sp=A.pts.map((p,i)=>proj(A.w[i].copy(p).applyMatrix4(mw),{}));
      ctx.globalAlpha=decoA*0.06; ctx.strokeStyle=A.col; ctx.lineWidth=1;
      ctx.beginPath(); let pen=false; for(const q of sp){ if(!q){pen=false;continue;} if(!pen){ctx.moveTo(q.x,q.y);pen=true;} else ctx.lineTo(q.x,q.y);} ctx.stroke();
      if(A.back) sp.reverse();
      const TL=A.len*2+6, hf=((time*A.spd+A.off)%1)*(sp.length-1+TL), head=hf|0;
      ctx.strokeStyle=A.col;
      for(let i=Math.max(1,head-TL);i<=Math.min(head,sp.length-1);i++){      // trail fades and thins towards the tail
        const a=sp[i-1], b=sp[i]; if(!a||!b) continue; const f=1-(head-i)/TL;

      if(hq&&head<=sp.length-1){ ctx.fillStyle=A.col; ctx.globalAlpha=decoA*0.18; ctx.beginPath(); ctx.arc(hq.x,hq.y,A.lw*2.6,0,7); ctx.fill();
        ctx.globalAlpha=decoA*0.85; ctx.beginPath(); ctx.arc(hq.x,hq.y,A.lw*0.9,0,7); ctx.fill(); }
    }

  }

  NODES.forEach(n=>{ if(!inSet(n.i)) return; n.world.copy(n.local).applyMatrix4(mw); n.scr=proj(n.world,{}); });
  for(const sg of EDGE_LIST){ let px=0,prev=null;
    if(!edgeIn(sg)) continue;
    if(netA<=0.01||!isActive(sg.a)||!isActive(sg.b)||(sg.mesh&&(!idle()||meshA<0.01))){ sg.px=0; continue; }
    for(let i=0;i<sg.local.length;i++){ sg.world[i].copy(sg.local[i]).applyMatrix4(mw); const q=proj(sg.world[i],{}); sg.scr[i]=q;
      if(q&&prev&&(onScreen(q,40)||onScreen(prev,40))) px+=Math.hypot(q.x-prev.x,q.y-prev.y); prev=q; }

    if(!edgeIn(sg)||!isActive(sg.a)||!isActive(sg.b)) continue;
    if(sg.mesh&&(!idle()||meshA<0.01)) continue;
    const key=sg.mesh?'m':(sg.a>=CAP0||sg.b>=CAP0)?'c':'r';

    let spread=0; for(const a of vis) for(const b of vis) spread=Math.max(spread,Math.hypot(a.scr.x-b.scr.x,a.scr.y-b.scr.y));
    if(groups[g].length>1 && spread<nodeS*3.2){
      const c=vis.reduce((o,n)=>({x:o.x+n.scr.x/vis.length,y:o.y+n.scr.y/vis.length}),{x:0,y:0});

glc.addEventListener('pointerleave',()=>{ lastMouse=null; hidePkt(); });
function updInspector(){
  if(mode!=='url'||!paused||!urlInfo||!lastMouse||dragI){ if(hoverPk) hidePkt(); if(mode==='url'&&paused&&!dragI) glc.style.cursor=''; return; }
  let hit=null; for(let i=pktHits.length-1;i>=0;i--){ const h=pktHits[i]; if(lastMouse.x>=h.x&&lastMouse.x<=h.x+h.w&&lastMouse.y>=h.y&&lastMouse.y<=h.y+h.h){ hit=h.pk; break; } }
  if(hit){ hoverPk=hit; showPkt(hit,lastMouse.x,lastMouse.y); glc.style.cursor='help'; }
  else { if(hoverPk) hidePkt(); if(!insetAt(lastMouse.x,lastMouse.y)) glc.style.cursor=''; }
}

/* ---------- begin journey ---------- */
const BEGIN_Z=0.68;
function resetLoop(){
  const S=loopSeq; S.packets=[]; S.queue=[]; S.stepIdx=-1; S.left=0; S.waitT=0.8+0; S.done=false;
  setPhase(-1); clearLog();
}
$('begin').addEventListener('click',()=>{
  if(mode==='held') leaveHeld();
  if(mode!=='loop'||beginTw) return;
  loopOn=true;
  const dist=Math.abs(BEGIN_Z-z);
  if(dist<0.02&&z>=BEGIN_Z){ startBoot(); return; }
  beginTw={from:z,t:0,dur:clamp(1.2+dist*6,1.2,5),then:startBoot};
});

/* ---------- full screen ---------- */
(function(){
  const btn=$('fs'), root=document.documentElement;
  const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
  const canFs=()=>!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
  function sync(){ const on=!!fsEl(); $('fs-in').style.display=on?'none':''; $('fs-out').style.display=on?'':'none';
    btn.title=on?'Exit full screen':'Full screen'; btn.setAttribute('aria-label',btn.title); }
  function openTab(){ try{ window.open(location.href,'_blank','noopener'); }catch(e){} }
  btn.addEventListener('click',()=>{
    if(fsEl()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); return; }
    if(!canFs()){ openTab(); return; }           // iframe without fullscreen permission: open in a new tab
    const req=root.requestFullscreen||root.webkitRequestFullscreen;
    try{ const p=req.call(root); if(p&&p.catch) p.catch(openTab); }catch(e){ openTab(); }
  });
  document.addEventListener('fullscreenchange',sync); document.addEventListener('webkitfullscreenchange',sync);
  sync();
})();

/* ---------- main loop ---------- */
let spin=0.6, last=performance.now(), time=0;
const stageEl=$('stage'), hint=$('hint');
let stageTxt='';
let running=true, onScreenNow=true, slowT=0, ema=16;
if('IntersectionObserver' in window){
  new IntersectionObserver(es=>{ onScreenNow=es[0].isIntersecting; if(onScreenNow&&!running){ running=true; last=performance.now(); requestAnimationFrame(frameLoop); } },{threshold:0}).observe($('app'));
}
function adapt(raw){
  ema=ema*0.95+raw*0.05;
  if(ema>28&&dprCap>1){ slowT+=raw/1000; if(slowT>2.5){ dprCap=Math.max(1,dprCap-0.25); slowT=0; ema=16; resize(); } } else slowT=Math.max(0,slowT-raw/2000);
}
function frameLoop(now){
  if(!onScreenNow){ running=false; return; }
  adapt(now-last);
  const dt=clamp((now-last)/1000,0,0.05); last=now; time+=dt;
  if(mode==='loop'&&beginTw){ beginTw.t+=dt; const u=clamp(beginTw.t/beginTw.dur,0,1), e=u*u*u*(u*(u*6-15)+10);
    z=zT=lerp(beginTw.from,BEGIN_Z,e); if(u>=1){ const f=beginTw.then; beginTw=null; if(f) f(); } }
  else if(mode==='loop'){ z+= (zT-z)*Math.min(1,dt*3.2); if(Math.abs(zT-z)<1e-4) z=zT; }
  if(!loopOn&&z>0.36) loopOn=true;    // zooming in by hand also starts the traffic

  // globe rotation: spin when zoomed out, then turn to face Australia
  spin+=dt*0.12*(1-sstep(0,0.1,z));
  const b=sstep(0.1,0.42,z);
  const tgtY=-LON_C; let d=((tgtY-spin)%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI;
  globe.rotation.set(lerp(0.32,LAT_C,b), spin+d*b, 0);
  globe.updateMatrixWorld(true);
  for(const r of satRings){ r.grp.rotation.y+=dt*r.speed; }
  const satA=1-sstep(0.18,0.38,z); satRings.forEach(r=>{r.ring.material.opacity=0.18*satA; r.L.u.uOpacity.value=satA; r.grp.visible=satA>0.01;});

  // camera
  if(mode==='loop'){
    cameraAt(z);
    if(heldBlend){ const B=heldBlend; B.t+=dt; const u=clamp(B.t/B.dur,0,1), e=1-u*u*u*(u*(u*6-15)+10);
      const T=camera.position.clone().sub(_O), L0=_O.length(), L1=B.O.length(), L=Math.exp(lerp(Math.log(L0),Math.log(L1),e));
      const Tm=T.lerp(B.T,e), Om=_O.clone().divideScalar(L0).lerp(B.O.clone().divideScalar(L1),e).normalize().multiplyScalar(L);
      camera.position.copy(Tm).add(Om); camera.up.copy(_U.clone().lerp(B.U,e).normalize()); camera.lookAt(Tm);
      if(u>=1) heldBlend=null; }
  }
  else updCam(dt);
  const alt=camera.position.length()-1;
  if(mode!=='loop'){ z=zT=Math.max(0.62,zFromAlt(alt)); }
  setNearFar(camera,alt);
  starCam.quaternion.copy(camera.quaternion);

  // layer fades
  dotLayers.forEach(L=>L.u.uTime.value=time);
  applyLayers(alt,z);

  // traffic
  capA=clamp(capA+dt*(idle()?1.5:-3),0,1);
  meshA=capA*(1-sstep(0.5,0.64,z));   // full mesh at the Australia view, thinning out towards Adelaide
  for(const n of NODES) n.flash=Math.max(0,n.flash-dt*1.6);
  if(idle()){ if(loopOn&&!beginTw){ bgSpawn(dt); seqMove(loopSeq,dt,false); } }
  else if(mode==='url'&&urlSeq){
    if(!paused){ const sdt=dt*speed; seqUpdate(urlSeq,sdt); seqMove(urlSeq,sdt,true); }
    if(urlSeq.done) endUrl();
  } else if(mode==='return'){
    if(!camTw) finishReturn();
  }

  renderer.clear(); renderer.render(starScene,starCam); renderer.clearDepth(); renderer.render(scene,camera);

  const netA=sstep(0.36,0.5,z);
  const decoA=1-sstep(0.18,0.4,z);
  const pk=idle()?loopSeq.packets:(urlSeq?urlSeq.packets:[]);
  drawOverlay(time,netA,decoA,pk,{});
  const settled=!camTw;
  insetA=clamp(insetA+dt*((mode==='url'&&shotWide&&settled)?2.5:-4),0,1);
  renderInsets(time,pk);
  updInspector();
  applyLayers(alt,z);

  // ui
  let st=STAGES[0][1]; for(const [v,n] of STAGES) if(z>=v) st=n;
  if(st!==stageTxt){ stageTxt=st; stageEl.innerHTML=`<b>${Math.round(z*100)}%</b> · ${st}`; }
  else stageEl.firstChild.textContent=Math.round(z*100)+'%';
  stageEl.classList.toggle('off',!idle());
  // address bar beside the laptop
  const lp=NODES[0].scr, showBar=((mode==='loop'&&z>0.9)||mode==='held')&&lp&&onScreen(lp,0);
  if(showBar){ const bw=urlbar.offsetWidth||360;
    const minL=VW>700?274:12; const L=clamp(lp.x-bw*0.35,minL,Math.max(minL,VW-bw-84)); const hr=$('hud').getBoundingClientRect(); let T=clamp(lp.y+46,60,VH-130); if(L<hr.right+8) T=Math.max(T,hr.bottom+10); urlbar.style.left=L+'px'; urlbar.style.top=T+'px'; }
  if(showBar!==urlbar.classList.contains('show')){ urlbar.classList.toggle('show',showBar); if(!showBar) urlIn.blur(); }
  if(onlineMsgT>0) onlineMsgT-=dt;
  const hintTxt=!idle()?'':onlineMsgT>0?'Your laptop is online. Type a web address.':(zT<0.03&&!beginTw)?'Press Begin Journey, or scroll to fly in':(z>0.8&&z<=0.9)?'Zoom all the way in to the laptop to type a web address':'';
  if(hintTxt) hint.textContent=hintTxt;
  thumb.style.top=((1-zT)*100)+'%'; fill.style.height=(zT*100)+'%';
  track.setAttribute('aria-valuenow',Math.round(zT*100));
  hint.style.opacity=hintTxt?1:0;
  $('begin').disabled=!idle();
  $('log').style.opacity=sstep(0.3,0.45,z);
  $('legend').style.opacity=idle()?decoA:0;
  requestAnimationFrame(frameLoop);
}
setPhase(-1);
requestAnimationFrame(frameLoop);
})();
</script>
</body>
